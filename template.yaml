AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Poker Tools - Flask on Lambda (Lambda Web Adapter) + API Gateway REST

# ==============================================================
# パラメータ
# ==============================================================
Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
    Description: デプロイ先の環境

# ==============================================================
# グローバル設定（全 Lambda 関数に適用）
# ==============================================================
Globals:
  Function:
    Timeout: 30
    MemorySize: 1770
    Architectures:
      - arm64

# ==============================================================
# リソース
# ==============================================================
Resources:

  # ── Lambda 実行ロール（最小権限）────────────────────────────
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "poker-tools-lambda-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # CloudWatch Logs への書き込み権限のみ付与する
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # ── Lambda 関数 ──────────────────────────────────────────────
  PokerToolsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "poker-tools-${Environment}"
      Role: !GetAtt LambdaExecutionRole.Arn
      PackageType: Image
      Environment:
        Variables:
          PORT: "8080"
          APP_ENV: !Ref Environment
          # LWA がアプリの起動完了を確認するパス
          AWS_LWA_READINESS_CHECK_PATH: "/"
      Events:
        # ルートパス（/）
        RootPath:
          Type: Api
          Properties:
            RestApiId: !Ref PokerToolsApi
            Path: /
            Method: ANY
        # それ以外の全パス
        ProxyPath:
          Type: Api
          Properties:
            RestApiId: !Ref PokerToolsApi
            Path: /{proxy+}
            Method: ANY
    Metadata:
      DockerTag: latest
      DockerContext: ./
      Dockerfile: Dockerfile

  # ── ウォームアップ用 EventBridge スケジュール ─────────────────
  WarmupSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "poker-tools-warmup-${Environment}"
      Description: Lambdaのコールドスタートを防ぐための定期ウォームアップ
      ScheduleExpression: "rate(5 minutes)"
      State: !If [IsProd, ENABLED, DISABLED]
      Targets:
        - Arn: !GetAtt PokerToolsFunction.Arn
          Id: WarmupTarget
          # Lambda Web Adapter が解釈できる API Gateway v1 プロキシイベント形式
          Input: '{"version":"1.0","resource":"/","path":"/","httpMethod":"GET","headers":{},"queryStringParameters":null,"body":null,"isBase64Encoded":false}'

  # EventBridge が Lambda を呼び出すための権限
  WarmupPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PokerToolsFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WarmupSchedule.Arn

  # ── CloudWatch Logs（ログ保持期間を明示管理）────────────────
  PokerToolsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/poker-tools-${Environment}"
      RetentionInDays: !If [IsProd, 90, 14]

  # ── API Gateway REST API ─────────────────────────────────────
  PokerToolsApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "poker-tools-api-${Environment}"
      StageName: !Ref Environment
      EndpointConfiguration:
        Type: REGIONAL

# ==============================================================
# 条件
# ==============================================================
Conditions:
  IsProd: !Equals [!Ref Environment, prod]

# ==============================================================
# 出力
# ==============================================================
Outputs:
  ApiEndpoint:
    Description: API Gateway エンドポイント URL（ステージプレフィックスあり）
    Value: !Sub "https://${PokerToolsApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/"
    Export:
      Name: !Sub "poker-tools-${Environment}-api-endpoint"

  LambdaFunctionArn:
    Description: Lambda 関数 ARN
    Value: !GetAtt PokerToolsFunction.Arn
    Export:
      Name: !Sub "poker-tools-${Environment}-function-arn"

  LambdaFunctionName:
    Description: Lambda 関数名
    Value: !Ref PokerToolsFunction
